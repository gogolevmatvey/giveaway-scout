[package]
name = "giveaway-scout-telemetry"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
hmac = "0.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
