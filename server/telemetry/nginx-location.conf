location = /giveaway-scout/api/v1/active {
    access_log off;
    error_log /dev/null;
    client_max_body_size 512;
    client_body_timeout 5s;
    limit_req zone=giveaway_scout_usage burst=30 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8793;
    proxy_connect_timeout 2s;
    proxy_read_timeout 7s;
    proxy_send_timeout 5s;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /giveaway-scout/statistics {
    return 308 /giveaway-scout/statistics/;
}

location ^~ /giveaway-scout/statistics/ {
    auth_basic "Giveaway Scout statistics";
    auth_basic_user_file /etc/giveaway-scout-telemetry/dashboard.htpasswd;
    access_log off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:8793/dashboard/;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_set_header Host localhost;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
