[package]
name = "giveaway-scout-cli"
version = "1.2.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
description = "Console interface for Giveaway Scout"

[dependencies]
giveaway-scout-core = { path = "../giveaway-scout-core" }
giveaway-scout-platform = { path = "../giveaway-scout-platform" }
giveaway-scout-runtime = { path = "../giveaway-scout-runtime" }
giveaway-scout-updater = { path = "../giveaway-scout-updater" }
fern = "0.7.1"
log = "0.4.34"
open = "5.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
minisign = "0.10.0"
