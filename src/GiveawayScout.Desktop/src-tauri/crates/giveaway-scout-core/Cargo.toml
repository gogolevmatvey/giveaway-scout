[package]
name = "giveaway-scout-core"
license = "MIT"
version = "0.1.0"
description = "Platform-independent domain logic for Giveaway Scout"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "rustls", "system-proxy"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.0", features = ["time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["macros", "rt"] }
