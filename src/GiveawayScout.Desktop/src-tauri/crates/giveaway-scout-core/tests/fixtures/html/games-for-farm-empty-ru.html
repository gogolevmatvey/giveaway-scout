<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Games for Farm</title>
  <link rel="canonical" href="https://give.gamesforfarm.com">
</head>
<body class="page-index">
  <!-- The same reduced structure with localized text; recognition does not
       depend on the language of headings, descriptions or image alternatives. -->
  <header class="header games_for_farm_site"><a href="/">Games for Farm</a></header>
  <div class="page_content">
    <section class="main_banner">
      <div class="container">
        <div class="main_banner__area">
          <div class="main_banner__wrapper">
            <div class="main_banner__title"><h1>Получайте бесплатные ключи для Steam</h1></div>
            <div class="main_banner__decs"><span>Выполняйте простые задания и получайте ключи Steam от <a href="https://gamesforfarm.com" target="_blank" rel="noopener noreferrer">gamesforfarm.com</a></span></div>
          </div>
        </div>
      </div>
    </section>
    <section class="history_buttons">
      <div class="container">
        <div class="history_buttons__list">
          <a href="/giveaways" class="history_buttons__element">
            <div class="history_buttons__image"><img src="/assets/images/icons-2/present.png" alt="Подарок"></div>
            <div class="history_buttons__title">История раздач</div>
          </a>
          <a href="/drawings" class="history_buttons__element">
            <div class="history_buttons__image"><img src="/assets/images/icons-2/cube.png" alt="Кубик"></div>
            <div class="history_buttons__title">История розыгрышей</div>
          </a>
        </div>
      </div>
    </section>
  </div>
  <footer><a href="/">Games for Farm</a></footer>
  <div class="page_modals"></div>
</body>
</html>
