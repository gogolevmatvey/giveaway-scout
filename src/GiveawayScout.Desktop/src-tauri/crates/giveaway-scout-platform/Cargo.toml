[package]
name = "giveaway-scout-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Shared profiles, installation identity and autostart for Giveaway Scout"

[dependencies]
giveaway-scout-core = { path = "../giveaway-scout-core" }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
