[package]
name = "giveaway-scout-release-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Offline verification and local staging of Giveaway Scout updater metadata"

[[bin]]
name = "giveaway-scout-release"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
minisign-verify = "0.3.0"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
url = "2.5.8"

[dev-dependencies]
minisign = "0.10.0"
