[package]
name = "giveaway-scout-runtime"
license = "MIT"
version = "1.2.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Shared headless monitoring runtime for Giveaway Scout"

[dependencies]
giveaway-scout-core = { path = "../giveaway-scout-core" }
fern = "0.7.1"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.0", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
