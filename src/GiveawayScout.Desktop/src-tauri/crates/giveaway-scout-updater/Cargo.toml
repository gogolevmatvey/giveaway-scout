[package]
name = "giveaway-scout-updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
description = "Shared authenticated update transport for Giveaway Scout"

[dependencies]
base64 = "0.22.1"
minisign-verify = "0.3.0"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
url = { version = "2.5.8", features = ["serde"] }
tempfile = "3.27.0"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
minisign = "0.10.0"
http = "1"
tokio = { version = "1.53.0", features = ["macros", "rt"] }
